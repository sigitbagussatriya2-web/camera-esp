<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB_ESP | Mobile Fix v2.2</title>
    <style>
        body { margin: 0; padding: 0; background: #050505; color: #00ff00; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        .container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #status-bar { position: fixed; top: 20px; left: 20px; padding: 15px; background: rgba(5, 5, 5, 0.9); border: 1px solid #00ffaa; box-shadow: 0 0 15px rgba(0, 255, 170, 0.4); z-index: 100; font-size: 11px; line-height: 1.6; max-width: 85%; }
        .hud-title { color: #00ffaa; font-weight: bold; margin-bottom: 5px; text-shadow: 0 0 5px #00ffaa; }
    </style>
    
    <script src="https://unpkg.com/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://unpkg.com/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body>

<div id="status-bar">
    <div class="hud-title">▼ BYPASS INJECTION v2.2</div>
    [ AI_CORE   ] <span id="core-status" style="color: yellow;">CONNECTING...</span><br>
    [ WEBCAM    ] <span id="cam-status">WAITING...</span><br>
    [ LOG_INFO  ] <span id="log-details" style="color: #aaa;">Bypassing CDN restrictions...</span>
</div>

<div class="container">
    <video id="webcam" autoplay muted playsinline webkit-playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const coreStatus = document.getElementById('core-status');
    const camStatus = document.getElementById('cam-status');
    const logDetails = document.getElementById('log-details');
    
    let model;

    const COLOR_ESP = '#00ffaa'; 
    const COLOR_RADAR_BG = 'rgba(5, 15, 10, 0.85)';
    const COLOR_RADAR_GRID = '#00ffaa';
    const FONT_SETTINGS = 'bold 14px "Courier New"';

    const KNOWN_HEIGHT_CM = 170; 
    const FOCAL_LENGTH = 380;    

    async function setupWebcam() {
        camStatus.innerHTML = '<span style="color:yellow">PROMPTING...</span>';
        
        // Memastikan API mediaDevices tersedia
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            // Coba fallback jadul jika di peramban in-app (seperti browser Facebook/IG/Tiktok)
            navigator.getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
            if (!navigator.getUserMedia) {
                camStatus.innerHTML = '<span style="color:red">UNSUPPORTED_BROWSER</span>';
                logDetails.innerHTML = 'Gunakan aplikasi Google Chrome asli, jangan buka lewat aplikasi lain.';
                return false;
            }
        }

        const constraints = {
            video: {
                facingMode: "user",
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    resizeCanvas();
                    camStatus.innerHTML = '<span style="color:#00ff55">CONNECTED</span>';
                    resolve(true);
                };
            });
        } catch (e) {
            console.error(e);
            camStatus.innerHTML = '<span style="color:red">BLOCKED</span>';
            logDetails.innerHTML = 'Klik ikon opsi/gembok di atas URL, lalu Izinkan Akses Kamera.';
            return false;
        }
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function drawRadar(predictions) {
        const radarRadius = 60; 
        const radarX = canvas.width - radarRadius - 20;
        const radarY = radarRadius + 20;

        ctx.fillStyle = COLOR_RADAR_BG;
        ctx.beginPath();
        ctx.arc(radarX, radarY, radarRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = COLOR_RADAR_GRID;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0, 255, 170, 0.25)';
        ctx.beginPath();
        ctx.moveTo(radarX - radarRadius, radarY); ctx.lineTo(radarX + radarRadius, radarY);
        ctx.moveTo(radarX, radarY - radarRadius); ctx.lineTo(radarX, radarY + radarRadius);
        ctx.stroke();

        predictions.forEach((prediction) => {
            if (prediction.class === 'person') {
                const [x, y, width, height] = prediction.bbox;
                const scaleX = canvas.width / video.videoWidth;
                const actualX = x * scaleX;
                const flippedX = canvas.width - (actualX + (width * scaleX));
                
                const distanceInCm = (KNOWN_HEIGHT_CM * FOCAL_LENGTH) / height;
                const distanceInMeters = distanceInCm / 100;

                const screenCenterX = canvas.width / 2;
                const targetRelativeX = (flippedX + (width * scaleX) / 2) - screenCenterX;

                const maxRangeMeters = 3; 
                const radarRangeFactor = radarRadius / maxRangeMeters;
                
                let blipX = radarX + (targetRelativeX * 0.15); 
                let blipY = radarY - (distanceInMeters * radarRangeFactor) + 25; 

                const distFromRadarCenter = Math.hypot(blipX - radarX, blipY - radarY);
                if (distFromRadarCenter < radarRadius - 4) {
                    ctx.fillStyle = '#ff3333'; 
                    ctx.beginPath();
                    ctx.arc(blipX, blipY, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        });
    }

    async function detectFrame() {
        if (!model) return;

        try {
            const predictions = await model.detect(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            drawRadar(predictions);

            const scaleX = canvas.width / video.videoWidth;
            const scaleY = canvas.height / video.videoHeight;

            predictions.forEach((prediction, index) => {
                if (prediction.class === 'person') {
                    const [x, y, width, height] = prediction.bbox;

                    const boxX = x * scaleX;
                    const boxY = y * scaleY;
                    const boxW = width * scaleX;
                    const boxH = height * scaleY;
                    const flippedX = canvas.width - (boxX + boxW);

                    const distanceInCm = (KNOWN_HEIGHT_CM * FOCAL_LENGTH) / height;
                    const distanceInMeters = distanceInCm / 100;

                    // GARIS SNAPLINE
                    ctx.strokeStyle = 'rgba(0, 255, 170, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width / 2, canvas.height); 
                    ctx.lineTo(flippedX + (boxW / 2), boxY + (boxH / 2)); 
                    ctx.stroke();

                    // ESP BOX
                    ctx.strokeStyle = COLOR_ESP;
                    ctx.lineWidth = 2;
                    const cSize = Math.min(boxW, boxH) * 0.25; 

                    ctx.beginPath();
                    ctx.moveTo(flippedX, boxY + cSize); ctx.lineTo(flippedX, boxY); ctx.lineTo(flippedX + cSize, boxY);
                    ctx.moveTo(flippedX + boxW - cSize, boxY); ctx.lineTo(flippedX + boxW, boxY); ctx.lineTo(flippedX + boxW, boxY + cSize);
                    ctx.moveTo(flippedX, boxY + boxH - cSize); ctx.lineTo(flippedX, boxY + boxH); ctx.lineTo(flippedX + cSize, boxY + boxH);
                    ctx.moveTo(flippedX + boxW - cSize, boxY + boxH); ctx.lineTo(flippedX + boxW, boxY + boxH); ctx.lineTo(flippedX + boxW, boxY + boxH - cSize);
                    ctx.stroke();

                    // TEKS INFORMASI TARGET
                    ctx.font = FONT_SETTINGS;
                    ctx.save();
                    ctx.scale(-1, 1);
                    
                    const infoText = `TARGET_P${index + 1} [${distanceInMeters.toFixed(2)}M]`;
                    const textWidth = ctx.measureText(infoText).width;
                    
                    ctx.fillStyle = 'rgba(5, 5, 5, 0.8)';
                    ctx.fillRect(-(flippedX + boxW), boxY - 24, textWidth + 10, 20);

                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(infoText, -(flippedX + boxW) + 5, boxY - 10);
                    
                    ctx.restore();
                }
            });
        } catch (err) {
            console.error(err);
        }

        requestAnimationFrame(detectFrame);
    }

    async function init() {
        logDetails.innerHTML = 'Downloading model files via Unpkg Secure...';
        try {
            // Memaksa load model cocoSsd
            model = await cocoSsd.load({ base: 'mobilenet_v2' }); // Menggunakan versi lite mobilenet agar ringan di HP
            coreStatus.innerHTML = '<span style="color:#00ff55">SUCCESS</span>';
            logDetails.innerHTML = 'Bypassed. Model injected successfully.';
            
            const camReady = await setupWebcam();
            if (camReady) {
                logDetails.innerHTML = 'Running radar mapping systems.';
                detectFrame();
            }
        } catch (e) {
            console.error(e);
            coreStatus.innerHTML = '<span style="color:red">BYPASS_FAILED</span>';
            logDetails.innerHTML = 'Sinyal / Jaringan memblokir koneksi database AI Google.';
        }
    }

    // Eksekusi setelah seluruh dokumen siap
    window.onload = init;
</script>
</body>
</html>
